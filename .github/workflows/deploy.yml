name: Build & Deploy .NET to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Publish Linux
        run: dotnet publish --configuration Release --no-build --output ./publish
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy application
        run: |
          rsync -az --delete --exclude='wwwroot/uploads/' --exclude='.claude/' ./publish/ raul@31.220.60.54:/home/raul/apps/root/
          ssh raul@31.220.60.54 "sudo systemctl restart webraul"
      - name: Health check
        run: |
          status=000
          for attempt in 1 2 3 4 5 6; do
            sleep 3
            status="$(curl -o /dev/null -s -w '%{http_code}' --max-time 20 https://pimentel.cloud)"
            [[ "$status" == "200" ]] && break
          done
          test "$status" = "200"
