server {
    listen 80;
    server_name pimentel.cloud www.pimentel.cloud;
    return 301 https://pimentel.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pimentel.cloud;

    ssl_certificate /etc/letsencrypt/live/pimentel.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pimentel.cloud/privkey.pem;

    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
